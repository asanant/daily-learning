<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习统计</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .nav { display: flex; gap: 10px; justify-content: center; margin: 20px 0; }
        .nav a { background: rgba(255,255,255,0.2); color: white; padding: 10px 20px; border-radius: 25px; text-decoration: none; }
        .nav a:hover { background: rgba(255,255,255,0.3); }
        .section { background: white; border-radius: 15px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .section-title { font-size: 1.4em; color: #333; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 3px solid #667eea; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 20px; border-radius: 15px; text-align: center; }
        .stat-value { font-size: 2.5em; font-weight: bold; }
        .stat-label { opacity: 0.9; font-size: 0.9em; }
        .chart-container { height: 300px; background: #f8f9fa; border-radius: 10px; padding: 20px; margin-bottom: 30px; position: relative; }
        .chart-title { text-align: center; color: #666; margin-bottom: 15px; }
        .bar-chart { display: flex; align-items: flex-end; justify-content: space-around; height: 220px; padding: 0 10px; }
        .bar-item { display: flex; flex-direction: column; align-items: center; flex: 1; max-width: 60px; }
        .bar { width: 40px; background: linear-gradient(to top, #667eea, #764ba2); border-radius: 5px 5px 0 0; transition: height 0.5s; min-height: 5px; }
        .bar-label { font-size: 0.7em; color: #666; margin-top: 8px; text-align: center; }
        .bar-value { font-size: 0.8em; color: #667eea; font-weight: bold; margin-bottom: 5px; }
        .history-list { max-height: 400px; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .history-item:last-child { border-bottom: none; }
        .history-left { }
        .history-date { font-weight: bold; color: #333; }
        .history-time { font-size: 0.8em; color: #999; }
        .history-score { font-size: 1.2em; font-weight: bold; }
        .score-high { color: #4caf50; }
        .score-mid { color: #ff9800; }
        .score-low { color: #f44336; }
        .history-details { font-size: 0.8em; color: #666; }
        .empty-state { text-align: center; padding: 40px; color: #999; }
        .weak-topics { background: #fff3cd; padding: 15px; border-radius: 10px; margin-top: 20px; }
        .weak-topics h4 { color: #856404; margin-bottom: 10px; }
        .topic-item { padding: 8px 0; border-bottom: 1px dashed #ffc107; }
        .topic-item:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 学习统计</h1>
            <p>追踪你的学习进度</p>
            <div class="nav">
                <a href="index.html">📚 今日学习</a>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">📈 总体概览</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalDays">0</div>
                    <div class="stat-label">学习天数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalQuestions">0</div>
                    <div class="stat-label">答题总数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalCorrect">0</div>
                    <div class="stat-label">正确数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="avgScore">0%</div>
                    <div class="stat-label">平均正确率</div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">📊 每日得分趋势</h2>
            <div class="chart-container">
                <div class="chart-title">最近7天得分（满分5分）</div>
                <div class="bar-chart" id="barChart"></div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">📝 答题历史</h2>
            <div class="history-list" id="historyList">
                <div class="empty-state">暂无答题记录</div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">🎯 薄弱环节分析</h2>
            <div id="weakAnalysis">
                <div class="empty-state">完成更多题目后会显示分析</div>
            </div>
        </div>
    </div>

    <script>
        // 题目知识点映射
        const topicMap = {
            '1': 'Activity生命周期',
            '2': 'Fragment与Activity',
            '3': 'SharedPreferences',
            '4': 'Handler机制',
            '5': 'ANR异常处理'
        };

        function loadData() {
            return JSON.parse(localStorage.getItem('learning_history') || '{}');
        }

        function calculateStats() {
            const data = loadData();
            const entries = Object.entries(data);
            
            if (entries.length === 0) return;

            // 总体统计
            const totalDays = entries.length;
            let totalQuestions = 0;
            let totalCorrect = 0;
            let wrongTopics = {};

            entries.forEach(([date, dayData]) => {
                totalQuestions += dayData.total;
                totalCorrect += dayData.score;

                // 分析错题
                if (dayData.answers) {
                    Object.entries(dayData.answers).forEach(([qNum, answer]) => {
                        // 这里需要知道正确答案，简化处理
                        // 实际应该存储每题的对错
                    });
                }
            });

            const avgScore = Math.round((totalCorrect / totalQuestions) * 100);

            document.getElementById('totalDays').textContent = totalDays;
            document.getElementById('totalQuestions').textContent = totalQuestions;
            document.getElementById('totalCorrect').textContent = totalCorrect;
            document.getElementById('avgScore').textContent = avgScore + '%';
        }

        function renderChart() {
            const data = loadData();
            const chart = document.getElementById('barChart');
            chart.innerHTML = '';

            // 获取最近7天
            const dates = Object.keys(data).sort().slice(-7);
            
            if (dates.length === 0) {
                chart.innerHTML = '<div class="empty-state">暂无数据</div>';
                return;
            }

            dates.forEach(date => {
                const dayData = data[date];
                const height = (dayData.score / dayData.total) * 200;
                const dateObj = new Date(date);
                const label = `${dateObj.getMonth()+1}/${dateObj.getDate()}`;

                const barItem = document.createElement('div');
                barItem.className = 'bar-item';
                barItem.innerHTML = `
                    <div class="bar-value">${dayData.score}/${dayData.total}</div>
                    <div class="bar" style="height: ${height}px"></div>
                    <div class="bar-label">${label}</div>
                `;
                chart.appendChild(barItem);
            });
        }

        function renderHistory() {
            const data = loadData();
            const list = document.getElementById('historyList');
            const entries = Object.entries(data).sort((a, b) => b[0].localeCompare(a[0]));

            if (entries.length === 0) {
                list.innerHTML = '<div class="empty-state">暂无答题记录</div>';
                return;
            }

            list.innerHTML = entries.map(([date, dayData]) => {
                const percent = Math.round((dayData.score / dayData.total) * 100);
                let scoreClass = 'score-high';
                if (percent < 60) scoreClass = 'score-low';
                else if (percent < 80) scoreClass = 'score-mid';

                const dateObj = new Date(date);
                const formattedDate = `${dateObj.getFullYear()}年${dateObj.getMonth()+1}月${dateObj.getDate()}日`;
                const time = dayData.timestamp ? new Date(dayData.timestamp).toLocaleTimeString('zh-CN', {hour: '2-digit', minute:'2-digit'}) : '';

                return `
                    <div class="history-item">
                        <div class="history-left">
                            <div class="history-date">${formattedDate}</div>
                            <div class="history-time">${time}</div>
                        </div>
                        <div style="text-align: right;">
                            <div class="history-score ${scoreClass}">${dayData.score}/${dayData.total}</div>
                            <div class="history-details">${percent}% 正确率</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderWeakAnalysis() {
            const data = loadData();
            const container = document.getElementById('weakAnalysis');
            
            // 这里需要更复杂的分析，简化版本
            const entries = Object.values(data);
            if (entries.length < 2) {
                container.innerHTML = '<div class="empty-state">需要更多数据才能分析薄弱环节</div>';
                return;
            }

            const avgScore = entries.reduce((sum, d) => sum + (d.score/d.total), 0) / entries.length;
            
            if (avgScore >= 0.8) {
                container.innerHTML = '<div style="text-align: center; padding: 20px; color: #4caf50;">🎉 表现优秀！继续保持！</div>';
            } else {
                container.innerHTML = `
                    <div class="weak-topics">
                        <h4>💡 学习建议</h4>
                        <div class="topic-item">• 平均正确率 ${Math.round(avgScore*100)}%，还有提升空间</div>
                        <div class="topic-item">• 建议回顾错题对应的知识点</div>
                        <div class="topic-item">• 每天坚持练习，稳步提升</div>
                    </div>
                `;
            }
        }

        // 初始化
        calculateStats();
        renderChart();
        renderHistory();
        renderWeakAnalysis();
    </script>
</body>
</html>
