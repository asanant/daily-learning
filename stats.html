<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习统计</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .nav { display: flex; gap: 10px; justify-content: center; margin: 20px 0; }
        .nav a { background: rgba(255,255,255,0.2); color: white; padding: 10px 20px; border-radius: 25px; text-decoration: none; }
        .nav a:hover { background: rgba(255,255,255,0.3); }
        .sync-status { text-align: center; margin: 10px 0; font-size: 0.9em; color: rgba(255,255,255,0.9); }
        .section { background: white; border-radius: 15px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .section-title { font-size: 1.4em; color: #333; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 3px solid #667eea; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 20px; border-radius: 15px; text-align: center; }
        .stat-value { font-size: 2em; font-weight: bold; }
        .stat-label { opacity: 0.9; font-size: 0.85em; margin-top: 5px; }
        .chart-container { height: 300px; background: #f8f9fa; border-radius: 10px; padding: 20px; margin-bottom: 30px; }
        .chart-title { text-align: center; color: #666; margin-bottom: 15px; }
        .bar-chart { display: flex; align-items: flex-end; justify-content: space-around; height: 220px; padding: 0 10px; }
        .bar-item { display: flex; flex-direction: column; align-items: center; flex: 1; max-width: 80px; }
        .bar { width: 35px; background: linear-gradient(to top, #667eea, #764ba2); border-radius: 5px 5px 0 0; transition: height 0.5s; min-height: 5px; }
        .bar-label { font-size: 0.7em; color: #666; margin-top: 8px; }
        .bar-value { font-size: 0.75em; color: #667eea; font-weight: bold; margin-bottom: 5px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .history-date { font-weight: bold; color: #333; }
        .history-time { font-size: 0.8em; color: #999; }
        .history-score { font-size: 1.1em; font-weight: bold; }
        .score-high { color: #4caf50; }
        .score-mid { color: #ff9800; }
        .score-low { color: #f44336; }
        .empty-state { text-align: center; padding: 40px; color: #999; }
        .loading { text-align: center; padding: 40px; color: #667eea; }
        .category-breakdown { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .category-card { background: #f8f9fa; padding: 15px; border-radius: 10px; text-align: center; }
        .category-title { font-size: 0.9em; color: #666; margin-bottom: 5px; }
        .category-score { font-size: 1.5em; font-weight: bold; color: #667eea; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 学习统计</h1>
            <p>追踪你的学习进度（数据云端同步）</p>
            <div class="nav">
                <a href="index.html">📚 今日学习</a>
            </div>
            <div class="sync-status" id="syncStatus">⏳ 加载中...</div>
        </div>

        <div class="section">
            <h2 class="section-title">📈 总体概览</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalDays">-</div>
                    <div class="stat-label">学习天数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalQuestions">-</div>
                    <div class="stat-label">答题总数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalCorrect">-</div>
                    <div class="stat-label">正确数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="avgScore">-</div>
                    <div class="stat-label">平均正确率</div>
                </div>
            </div>
            <div class="category-breakdown">
                <div class="category-card">
                    <div class="category-title">📱 Android 题</div>
                    <div class="category-score" id="androidAvg">-%</div>
                </div>
                <div class="category-card">
                    <div class="category-title">📖 英语阅读</div>
                    <div class="category-score" id="englishAvg">-%</div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">📊 每日得分趋势</h2>
            <div class="chart-container">
                <div class="chart-title">最近7天得分（满分10分）</div>
                <div class="bar-chart" id="barChart">
                    <div class="loading">加载数据中...</div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">📝 答题历史</h2>
            <div id="historyList">
                <div class="loading">加载数据中...</div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">🎯 学习建议</h2>
            <div id="weakAnalysis">
                <div class="loading">加载数据中...</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    
    <script>
        // Firebase 配置（需要替换成你自己的）
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function getDeviceId() {
            return localStorage.getItem('device_id') || 'unknown';
        }

        const deviceId = getDeviceId();

        // 检查连接
        db.ref('.info/connected').on('value', (snap) => {
            const status = document.getElementById('syncStatus');
            status.innerHTML = snap.val() ? '🟢 已连接云端' : '🔴 离线模式';
        });

        async function loadAllData() {
            try {
                const snapshot = await db.ref('history').once('value');
                const allData = snapshot.val() || {};
                
                const myHistory = {};
                Object.entries(allData).forEach(([date, devices]) => {
                    if (devices[deviceId]) {
                        myHistory[date] = devices[deviceId];
                    }
                });

                renderStats(myHistory);
                renderChart(myHistory);
                renderHistory(myHistory);
                renderAnalysis(myHistory);
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('syncStatus').innerHTML = '⚠️ 加载失败';
            }
        }

        function renderStats(data) {
            const entries = Object.values(data);
            if (entries.length === 0) {
                document.getElementById('totalDays').textContent = '0';
                document.getElementById('totalQuestions').textContent = '0';
                document.getElementById('totalCorrect').textContent = '0';
                document.getElementById('avgScore').textContent = '0%';
                document.getElementById('androidAvg').textContent = '0%';
                document.getElementById('englishAvg').textContent = '0%';
                return;
            }

            const totalDays = entries.length;
            const totalQuestions = entries.reduce((sum, d) => sum + (d.total || 10), 0);
            const totalCorrect = entries.reduce((sum, d) => sum + (d.score || 0), 0);
            const avgScore = Math.round((totalCorrect / totalQuestions) * 100);

            // 分类统计
            let androidTotal = 0, androidCorrect = 0;
            let englishTotal = 0, englishCorrect = 0;
            
            entries.forEach(d => {
                if (d.android) {
                    androidTotal += d.android.total || 5;
                    androidCorrect += d.android.score || 0;
                }
                if (d.english) {
                    englishTotal += d.english.total || 5;
                    englishCorrect += d.english.score || 0;
                }
            });

            document.getElementById('totalDays').textContent = totalDays;
            document.getElementById('totalQuestions').textContent = totalQuestions;
            document.getElementById('totalCorrect').textContent = totalCorrect;
            document.getElementById('avgScore').textContent = avgScore + '%';
            document.getElementById('androidAvg').textContent = androidTotal > 0 ? Math.round((androidCorrect / androidTotal) * 100) + '%' : '0%';
            document.getElementById('englishAvg').textContent = englishTotal > 0 ? Math.round((englishCorrect / englishTotal) * 100) + '%' : '0%';
        }

        function renderChart(data) {
            const chart = document.getElementById('barChart');
            const dates = Object.keys(data).sort().slice(-7);
            
            if (dates.length === 0) {
                chart.innerHTML = '<div class="empty-state">暂无数据</div>';
                return;
            }

            chart.innerHTML = dates.map(date => {
                const dayData = data[date];
                const height = (dayData.score / (dayData.total || 10)) * 200;
                const dateObj = new Date(date);
                const label = `${dateObj.getMonth()+1}/${dateObj.getDate()}`;

                return `
                    <div class="bar-item">
                        <div class="bar-value">${dayData.score}/${dayData.total || 10}</div>
                        <div class="bar" style="height: ${height}px"></div>
                        <div class="bar-label">${label}</div>
                    </div>
                `;
            }).join('');
        }

        function renderHistory(data) {
            const list = document.getElementById('historyList');
            const entries = Object.entries(data).sort((a, b) => b[0].localeCompare(a[0]));

            if (entries.length === 0) {
                list.innerHTML = '<div class="empty-state">暂无答题记录</div>';
                return;
            }

            list.innerHTML = entries.map(([date, dayData]) => {
                const total = dayData.total || 10;
                const percent = Math.round((dayData.score / total) * 100);
                let scoreClass = 'score-high';
                if (percent < 60) scoreClass = 'score-low';
                else if (percent < 80) scoreClass = 'score-mid';

                const dateObj = new Date(date);
                const formattedDate = `${dateObj.getFullYear()}年${dateObj.getMonth()+1}月${dateObj.getDate()}日`;
                const time = dayData.timestamp ? new Date(dayData.timestamp).toLocaleTimeString('zh-CN', {hour: '2-digit', minute:'2-digit'}) : '';
                
                const androidInfo = dayData.android ? `Android: ${dayData.android.score}/${dayData.android.total}` : '';
                const englishInfo = dayData.english ? `英语: ${dayData.english.score}/${dayData.english.total}` : '';

                return `
                    <div class="history-item">
                        <div>
                            <div class="history-date">${formattedDate}</div>
                            <div class="history-time">${time} | ${androidInfo} ${englishInfo}</div>
                        </div>
                        <div style="text-align: right;">
                            <div class="history-score ${scoreClass}">${dayData.score}/${total}</div>
                            <div>${percent}%</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderAnalysis(data) {
            const container = document.getElementById('weakAnalysis');
            const entries = Object.values(data);
            
            if (entries.length === 0) {
                container.innerHTML = '<div class="empty-state">完成更多题目后会显示分析</div>';
                return;
            }

            const avgScore = entries.reduce((sum, d) => sum + (d.score / (d.total || 10)), 0) / entries.length;
            
            if (avgScore >= 0.8) {
                container.innerHTML = '<div style="text-align:center;padding:20px;color:#4caf50;">🎉 表现优秀！平均正确率 ' + Math.round(avgScore*100) + '%，继续保持！</div>';
            } else {
                container.innerHTML = `
                    <div style="background:#fff3cd;padding:15px;border-radius:10px;">
                        <h4 style="color:#856404;margin-bottom:10px;">💡 学习建议</h4>
                        <div style="padding:8px 0;border-bottom:1px dashed #ffc107;">• 平均正确率 ${Math.round(avgScore*100)}%，还有提升空间</div>
                        <div style="padding:8px 0;border-bottom:1px dashed #ffc107;">• 建议回顾错题对应的知识点</div>
                        <div style="padding:8px 0;border-bottom:1px dashed #ffc107;">• 每天坚持练习，稳步提升</div>
                        <div style="padding:8px 0;">• 目标：80% 以上正确率 🎯</div>
                    </div>
                `;
            }
        }

        loadAllData();
    </script>
</body>
</html>
